name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; main is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleared_owner
          POSTGRES_PASSWORD: cleared_owner
          POSTGRES_DB: cleared_test
        ports:
          - 5432:5432
        # Checked over TCP: during first-start init the server listens on the unix
        # socket only, so a socket check reports healthy too early.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cleared_owner -d cleared_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLEARED_ENVIRONMENT: test
      CLEARED_DATABASE_URL: postgresql+asyncpg://cleared_app:cleared_app@127.0.0.1:5432/cleared_test
      CLEARED_MIGRATION_DATABASE_URL: postgresql+asyncpg://cleared_owner:cleared_owner@127.0.0.1:5432/cleared_test
      CLEARED_TEST_APP_DATABASE_URL: postgresql+asyncpg://cleared_app:cleared_app@127.0.0.1:5432/cleared_test
      CLEARED_TEST_OWNER_DATABASE_URL: postgresql+asyncpg://cleared_owner:cleared_owner@127.0.0.1:5432/cleared_test
      CLEARED_SECRET_KEY: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Create the non-owner role the tests connect as
        run: |
          PGPASSWORD=cleared_owner psql -h 127.0.0.1 -U cleared_owner -d cleared_test -v ON_ERROR_STOP=1 <<'SQL'
          create role cleared_app login password 'cleared_app' nobypassrls;
          grant connect on database cleared_test to cleared_app;
          SQL
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint and types
        run: |
          npx biome check src
          npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx vite build

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
