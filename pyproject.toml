[project]
name = "cleared"
version = "0.1.0"
description = "Credential compliance for home care and medical staffing agencies."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.5",
  "pyright==1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleared"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["cleared"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportDeprecated = "error"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
